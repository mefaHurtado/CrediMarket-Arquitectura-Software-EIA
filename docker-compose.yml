name: credimarket
x-api: &api
  build:
    context: .
    dockerfile: Dockerfile
  image: credimarket-api:local
  restart: unless-stopped
  networks: [backend]
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Ejecuta iniciar_windows.ps1}
      DB_PRODUCTS_PASSWORD: ${DB_PRODUCTS_PASSWORD:?}
      DB_CLIENTS_PASSWORD: ${DB_CLIENTS_PASSWORD:?}
      DB_LOANS_PASSWORD: ${DB_LOANS_PASSWORD:?}
      DB_INVENTORY_PASSWORD: ${DB_INVENTORY_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:?}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:?}
    ports: ["127.0.0.1:15672:15672"]
    volumes: ["rabbit_data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 18
    networks: [backend]
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [backend]
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.ml
    image: credimarket-ml:local
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--backend-store-uri", "sqlite:////tracking/mlflow.db", "--serve-artifacts", "--artifacts-destination", "/tracking/artifacts"]
    restart: unless-stopped
    ports: ["127.0.0.1:5000:5000"]
    volumes: ["mlflow_data:/tracking"]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5000/health\",timeout=4)'" ]
      interval: 8s
      timeout: 5s
      retries: 25
  train:
    image: credimarket-ml:local
    build:
      context: .
      dockerfile: Dockerfile.ml
    command: ["python", "ml/train.py"]
    environment:
      MODEL_DIR: /models
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes: ["model_data:/models"]
    depends_on:
      mlflow: {condition: service_healthy}
    networks: [backend]
    restart: "no"
  products:
    <<: *api
    command: ["uvicorn", "services.products.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg2://products_user:${DB_PRODUCTS_PASSWORD}@postgres:5432/products_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\",timeout=3)'" ]
      interval: 6s
      retries: 25
  clients:
    <<: *api
    command: ["uvicorn", "services.clients.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg2://clients_user:${DB_CLIENTS_PASSWORD}@postgres:5432/clients_db
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD}
      DEMO_CLIENT_PASSWORD: ${DEMO_CLIENT_PASSWORD}
      DEMO_RISK_PASSWORD: ${DEMO_RISK_PASSWORD}
      DEMO_SECOND_PASSWORD: ${DEMO_SECOND_PASSWORD}
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\",timeout=3)'" ]
      interval: 6s
      retries: 25
  inventory:
    <<: *api
    command: ["uvicorn", "services.inventory.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg2://inventory_user:${DB_INVENTORY_PASSWORD}@postgres:5432/inventory_db
      PRODUCTS_URL: http://products:8000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres: {condition: service_healthy}
      products: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\",timeout=3)'" ]
      interval: 6s
      retries: 25
  loans:
    <<: *api
    command: ["uvicorn", "services.loans.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg2://loans_user:${DB_LOANS_PASSWORD}@postgres:5432/loans_db
      CLIENTS_URL: http://clients:8000
      PRODUCTS_URL: http://products:8000
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      MODEL_DIR: /models
    volumes: ["model_data:/models"]
    depends_on:
      postgres: {condition: service_healthy}
      train: {condition: service_completed_successfully}
      clients: {condition: service_healthy}
      products: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/ready\",timeout=3)'" ]
      interval: 6s
      retries: 25
  inventory-worker:
    <<: *api
    command: ["python", "-m", "services.inventory.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg2://inventory_user:${DB_INVENTORY_PASSWORD}@postgres:5432/inventory_db
      RABBITMQ_URL: amqp://${RABBIT_USER}:${RABBIT_PASSWORD}@rabbitmq:5672/%2F
      RESERVATION_TTL_SECONDS: 300
    depends_on:
      inventory: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
  loans-worker:
    <<: *api
    command: ["python", "-m", "services.loans.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg2://loans_user:${DB_LOANS_PASSWORD}@postgres:5432/loans_db
      RABBITMQ_URL: amqp://${RABBIT_USER}:${RABBIT_PASSWORD}@rabbitmq:5672/%2F
    depends_on:
      loans: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
  frontend:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:8081:80"]
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      products: {condition: service_healthy}
      clients: {condition: service_healthy}
      loans: {condition: service_healthy}
      inventory: {condition: service_healthy}
    networks: [backend]
volumes:
  postgres_data:
  rabbit_data:
  mlflow_data:
  model_data:
networks:
  backend: {}
