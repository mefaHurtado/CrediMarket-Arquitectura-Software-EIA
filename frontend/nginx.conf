server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
    location /api/productos/ { proxy_pass http://products:8000/; proxy_read_timeout 8s; }
    location /api/clientes/ { proxy_pass http://clients:8000/; proxy_read_timeout 8s; client_max_body_size 8m; }
    location /api/prestamos/ { proxy_pass http://loans:8000/; proxy_read_timeout 8s; }
    location /api/inventario/ { proxy_pass http://inventory:8000/; proxy_read_timeout 8s; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
}
